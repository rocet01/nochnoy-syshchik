    case 'person':UI.person(t.dataset.id);break;
    case 'calltalk':{const p=personById(t.dataset.id);UI.closeModal(true);UI.closeNb();if(p)UI.talk(p);break}
    case 'mark':{e.stopPropagation();const id=t.dataset.id,m=t.dataset.m,cur=STATE.marks[id];STATE.marks[id]=m?(cur===m?null:m):(cur==='sus'?'clr':cur==='clr'?null:'sus');if(t.closest('#modal'))UI.closeModal(true);if(STATE.nbOpen)UI.renderNb();break}
    case 'star':e.stopPropagation();STATE.stars[t.dataset.id]=!STATE.stars[t.dataset.id];UI.renderNb();break;
    case 'acck':STATE.acc.k=t.dataset.id;UI.renderNb();break;case 'accm':STATE.acc.m=t.dataset.id;UI.renderNb();break;case 'accw':STATE.acc.w=t.dataset.id;UI.renderNb();break;
    case 'proof':{const p=STATE.acc.p,id=t.dataset.id,i=p.indexOf(id);if(i>=0)p.splice(i,1);else if(p.length<3)p.push(id);else UI.toast('Не больше трёх доказательств','red');UI.renderNb();break}
    case 'vercheck':UI.verCheck();break;case 'accuse':UI.accuseConfirm();break;case 'accusego':finishCase();break;
    case 'mapclick':UI.mapClick(e);break;
    case 'hint':useHint(t.dataset.k);break;
    case 'adhint':(async()=>{const k=t.dataset.k;const ok=await ADS.rewarded('Реклама за подсказку');if(ok){SAVE.hints[k]=(SAVE.hints[k]||0)+1;save();UI.toast('Подсказка получена','green');if(STATE.nbOpen)UI.renderNb();if(STATE.screen==='scene'&&!STATE.nbOpen)ENG.frozen=false}else if(ok===false)UI.toast('Реклама не досмотрена','red')})();break;
    case 'adcoins':(async()=>{const ok=await ADS.rewarded('Реклама за монеты');if(ok){SAVE.coins+=12;save();UI.toast('+12 монет','gold');UI.render()}})();break;
    case 'afterresult':(async()=>{const wasB=STATE.result&&STATE.result.c.mode==='bonus';STATE.case=null;STATE.screen=wasB?'bonus':'menu';UI.render();await ADS.interstitial();maybeBonus();try{VKP.maybeAskNotifications()}catch(e){}})();break;
    case 'vknotif':(async()=>{if(VKP.notifOn()){UI.toast('Уведомления уже включены','green');return}const ok=await VKP.askNotifications(true);if(!ok)UI.toast('Разрешение не выдано — можно включить позже','red');UI.render()})();break;
    case 'shop':STATE.screen='shop';UI.render();break;case 'shoptab':STATE.shopTab=t.dataset.tab;UI.render();break;
    case 'buy':{const f=shopItem(t.dataset.id);if(!f)break;if(SAVE.coins<f.it[2]){UI.toast('Не хватает монет','red');break}SAVE.coins-=f.it[2];SAVE.owned.push(f.it[0]);SAVE.skin[f.cat]=f.it[0];saveNow();SFX.ach();UI.toast('Куплено: '+f.it[1],'green');checkAch();UI.render();break}
    case 'equip':{const f=shopItem(t.dataset.id);if(f&&isOwned(f.it[0])){SAVE.skin[f.cat]=f.it[0];save();UI.render()}break}
    case 'mbuy':{const tr=findTrack(t.dataset.id);if(ownsMusic(tr.id))break;if(SAVE.coins<tr.price){UI.toast('Не хватает монет','red');break}SAVE.coins-=tr.price;SAVE.music.owned.push(tr.id);if(!SAVE.music.active.includes(tr.id))SAVE.music.active.push(tr.id);saveNow();SFX.ach();checkAch();UI.render();break}
    case 'mtrack':MUSIC.setTrack(t.dataset.id);if(!MUSIC.playing&&SAVE.settings.music)MUSIC.start();UI.render();break;
    case 'mtoggle':{const id=t.dataset.id,ac=SAVE.music.active,i=ac.indexOf(id);if(i>=0){if(ac.length<=1){UI.toast('В плейлисте должен остаться хотя бы один трек','red');break}ac.splice(i,1)}else ac.push(id);save();UI.render();break}
    case 'ach':case 'board':case 'archive':case 'settings':STATE.screen=a;UI.render();break;
    case 'toggle':{const k=t.dataset.k;SAVE.settings[k]=SAVE.settings[k]===false;
      if(k==='music'){if(SAVE.settings.music)MUSIC.start();else MUSIC.stop()}
      if(!SAVE.settings.sound||!SAVE.settings.rain)AMB.stop();else if(STATE.screen==='scene')AMB.start(.03);
      save();if(STATE.screen==='scene')pauseModal();else UI.render();break}
    case 'reset':UI.modal('<h2>Сбросить прогресс?</h2><p class="muted">Удалятся очки, монеты, покупки, награды и архив. Отменить нельзя.</p><div class="row"><button class="btn danger" data-act="resetgo">Сбросить</button><button class="btn ghost" data-act="closemodal">Отмена</button></div>');break;
    case 'resetgo':SAVE=clone(DEFAULT_SAVE);saveNow();STATE.case=null;UI.closeModal(true);STATE.screen='menu';UI.render();UI.toast('Прогресс сброшен','red');break;
    case 'tutorial':showTut(0);break;case 'tut':showTut(+t.dataset.i);break;
    case 'tutdone':SAVE.flags.tutorialDone=true;checkAch();save();UI.closeModal(true);break;
    case 'playmg':playMG(t.dataset.id,t.dataset.r);break;
    case 'tutmenu':tutorialOffer();break;case 'tutcase':UI.closeModal(true);startCase('novice','tutorial','tutorial');break;
    case 'tutskip':SAVE.flags.tutorialDone=true;checkAch();save();UI.closeModal(true);break;
    case 'coachmin':{const el=$('coach');if(el)el.classList.toggle('min');break}
  }
});
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')UI.closeModal()});
$('dlg').addEventListener('click',e=>{if(e.target.id==='dlg')UI.closeDlg()});
$('nb').addEventListener('click',e=>{if(e.target.id==='nb')UI.closeNb()});
const KEYC={KeyW:'w',KeyA:'a',KeyS:'s',KeyD:'d',KeyE:'e',KeyN:'n',KeyM:'m',ArrowUp:'arrowup',ArrowDown:'arrowdown',ArrowLeft:'arrowleft',ArrowRight:'arrowright',
  Space:' ',Enter:'enter',NumpadEnter:'enter',Escape:'escape',Tab:'tab',ShiftLeft:'shift',ShiftRight:'shift'};
const keyOf=e=>KEYC[e.code]||(/^(Digit|Numpad)[1-9]$/.test(e.code||'')?e.code.slice(-1):(e.key||'').toLowerCase());
document.addEventListener('input',e=>{const t=e.target;if(!t||!t.dataset||!t.dataset.vol)return;
  SAVE.settings[t.dataset.vol==='music'?'musicVol':'sfxVol']=clamp(+t.value/100,0,1);audioInit();applyVolume();save();if(t.dataset.vol==='sfx')SFX.click()});
document.addEventListener('keydown',e=>{
  const k=keyOf(e);
  if($('modal').classList.contains('on')){if(k==='escape')UI.closeModal();return}
  if(UI.talking){if(k==='escape')UI.closeDlg();else if(/^[1-9]$/.test(k)){const b=document.querySelectorAll('#qs [data-act]')[+k-1];if(b)b.click()}else if((k===' '||k==='enter')&&UI._tw&&UI._twDone){e.preventDefault();UI._twDone()}return}
  if(STATE.nbOpen){if(k==='escape'||k==='n'||k==='т'){e.preventDefault();UI.closeNb()}return}
  if(STATE.screen!=='scene')return;
  ENG.keys[k]=true;unlockAudio();
  if(['arrowup','arrowdown','arrowleft','arrowright',' ','tab'].includes(k))e.preventDefault();
  if(e.repeat)return;
  if(k==='e'||k==='у'||k===' '||k==='enter')ENG.interact();
  else if(k==='n'||k==='т'||k==='tab')UI.nb();
  else if(k==='m'||k==='ь')UI.nb('map');
  else if(k==='escape')pauseModal();
});
document.addEventListener('keyup',e=>{ENG.keys[keyOf(e)]=false});
window.addEventListener('blur',()=>{ENG.keys={}});

/* ======================= ЗАПУСК ======================= */
(function boot(){
  SDK.init();
  try{
    if(!Array.isArray(SAVE.owned))SAVE.owned=clone(DEFAULT_SAVE.owned);
    if(!SAVE.music||!Array.isArray(SAVE.music.owned))SAVE.music=clone(DEFAULT_SAVE.music);
    SAVE.music.owned=SAVE.music.owned.filter(id=>MUSIC_TRACKS.some(t=>t.id===id));['noir','tension','jazz_soft'].forEach(id=>{if(!SAVE.music.owned.includes(id))SAVE.music.owned.push(id)});
    SAVE.music.active=(SAVE.music.active||[]).filter(id=>SAVE.music.owned.includes(id));if(!SAVE.music.active.length)SAVE.music.active=['noir'];
    if(!ownsMusic(SAVE.music.current))SAVE.music.current='noir';MUSIC.currentId=SAVE.music.current;
    ['hat','coat','face'].forEach(k=>{if(!SAVE.skin[k]||!isOwned(SAVE.skin[k]))SAVE.skin[k]=DEFAULT_SAVE.skin[k]});
    if(SAVE.skin.coat==='coat_gray'&&!SAVE.flags.trenchGiven){SAVE.flags.trenchGiven=true}
    if(!Array.isArray(SAVE.minigames))SAVE.minigames=[];
    saveNow();
  }catch(e){}
  UI.render();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{PXT.reset()});
  window.addEventListener('resize',()=>{ENG.resize();HERO.resize()});
  /* Яндекс Игры: без контекстного меню и с разметкой «идёт игра» (GameplayAPI start/stop) */
  document.addEventListener('contextmenu',e=>{if(!(e.target&&e.target.closest&&e.target.closest('input')))e.preventDefault()});
  let _gp=null;setInterval(()=>{if(!SDK.ready())return;const m=document.getElementById('modal');
    const on=STATE.screen==='scene'&&ENG.running&&!(m&&m.classList.contains('on'))&&!document.hidden&&!ADS.busy&&!SDK.paused;if(on!==_gp){_gp=on;SDK.gameplay(on)}},400);
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){MUSIC.stop();AMB.stop();if(AC)try{AC.suspend()}catch(e){}}
    else{if(AC)try{AC.resume()}catch(e){}if(SAVE.settings.music&&_audioUnlocked)MUSIC.start();if(STATE.screen==='scene')AMB.start(.03)}
  });
  if(!SAVE.flags.tutorialDone)setTimeout(()=>tutorialOffer(),700);
  else if(SAVE.flags.migrated&&!SAVE.flags.migratedShown){SAVE.flags.migratedShown=true;save();setTimeout(()=>UI.toast('Прогресс из прошлой версии перенесён','green'),900)}
})();
</script>
