<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<script src="/sdk.js" async onload="window.__ysdkLoad&&window.__ysdkLoad()"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111a2c">
<title>Ночной сыщик — дела без срока давности</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;500;600;700&family=PT+Sans:ital,wght@0,400;0,700;1,400&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --void:#070a12;--night:#111a2c;--night2:#18233b;--night3:#22304f;--edge:#34466e;
  --ink:#f0e8d4;--dim:#a9b3cc;--faint:#6d7896;
  --amber:#f2a93b;--amber2:#ffd27a;--amberD:#8a5a14;
  --red:#d24e38;--redD:#6e2218;--teal:#63b6c6;--green:#79c27a;--violet:#c79ae8;
  --manila:#c9ab72;--manilaD:#a8884f;--paper:#efe3c4;--paper2:#dccb9f;--type:#241d14;--typeD:#54462f;--stamp:#b3362a;
  --fpx:'Rubik',system-ui,'Segoe UI',sans-serif;
  --ftype:'PT Sans',system-ui,'Segoe UI',sans-serif;
  --fdoc:'PT Serif',Georgia,serif;
  --ftitle:'Press Start 2P','Rubik',monospace;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"],:root:not([data-theme="light"]){--void:#070a12}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;background:var(--void);overscroll-behavior:none;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--void);overscroll-behavior:none;color:var(--ink);font:16px/1.5 var(--ftype);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.vol{width:min(220px,46vw);height:28px;accent-color:var(--amber);cursor:pointer;margin:0}
button:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--amber2);outline-offset:3px}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
img.px{image-rendering:pixelated;image-rendering:crisp-edges}
#app{position:relative;height:100%;width:100%;overflow:hidden}
b,strong{font-weight:700}

/* ---------- кнопки ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 16px/1.15 var(--fpx);letter-spacing:.1px;
  padding:12px 16px;min-height:46px;color:var(--ink);background:var(--night3);position:relative;border-radius:3px;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.07),0 0 0 2px var(--void),0 4px 0 2px var(--void);
  transition:transform .06s,background .12s}
.btn:hover{background:#2a3a5e}
.btn:active{transform:translateY(3px);box-shadow:inset 0 -1px 0 rgba(0,0,0,.35),0 0 0 2px var(--void),0 1px 0 2px var(--void)}
.btn.primary{background:var(--amber);color:#21140a}
.btn.primary:hover{background:#ffb94e}
.btn.danger{background:var(--red);color:#fff6ee}
.btn.danger:hover{background:#e05a42}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 2px var(--edge)}
.btn.ghost:hover{background:rgba(255,255,255,.05)}
.btn.ghost:active{transform:none;background:rgba(255,255,255,.04)}
.btn.block{display:flex;width:100%}
.btn.sm{font-size:14.5px;padding:9px 13px;min-height:40px}
.btn[disabled],.btn.off{opacity:.42;pointer-events:none}
.btn .k{font:400 13px/1.2 var(--ftype);opacity:.78}
.chip{display:inline-block;font:500 13px/1.25 var(--fpx);padding:3px 8px;background:rgba(255,255,255,.08);color:var(--dim);border-radius:2px}
.chip.ok{background:rgba(121,194,122,.18);color:#b4ebb5}
.chip.bad{background:rgba(210,78,56,.24);color:#ffb6a6}
.chip.warn{background:rgba(242,169,59,.2);color:var(--amber2)}
.chip.new{background:var(--red);color:#fff;font-weight:700;font-size:11px;letter-spacing:.6px;padding:2px 6px}

/* ---------- меню ---------- */
.menu{position:absolute;inset:0;display:grid;grid-template-columns:minmax(320px,440px) 1fr;}
.menu canvas#hero{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.menu-panel{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:28px 28px 28px 40px;
  background:linear-gradient(90deg,rgba(7,10,18,.95) 0%,rgba(7,10,18,.86) 75%,rgba(7,10,18,0) 100%);overflow-y:auto}
.title{font:400 30px/1.3 var(--ftitle);color:var(--ink);margin:0;letter-spacing:0;text-shadow:0 3px 0 #000,0 0 26px rgba(242,169,59,.3)}
.subtitle{font:italic 400 17px/1.35 var(--fdoc);color:var(--dim);margin:8px 0 4px}
.menu-btns{display:flex;flex-direction:column;gap:12px;max-width:360px}
.menu-btns .btn{justify-content:space-between;text-align:left}
.menu-btns .btn.bonus{background:linear-gradient(90deg,#3b2a5a,#2a3355);box-shadow:inset 0 -3px 0 rgba(0,0,0,.35),inset 0 0 0 1px rgba(199,154,232,.35),0 0 0 2px var(--void),0 4px 0 2px var(--void)}
.menu-btns .btn.bonus:hover{background:linear-gradient(90deg,#4a3570,#334070)}
.menu-row{display:flex;gap:10px;flex-wrap:wrap;max-width:360px}
.menu-row .btn{flex:1 1 30%}
.wallet{display:flex;gap:18px;align-items:baseline;font:500 15px var(--fpx);color:var(--dim)}
.wallet b{color:var(--amber2);font-size:20px}
.rank{font:400 15px var(--ftype);color:var(--dim)}
.rank b{color:var(--ink);font-weight:700}
@media (max-width:760px){
  .menu{grid-template-columns:1fr;grid-template-rows:34% 1fr}
  .menu canvas#hero{height:40%}
  .menu-panel{grid-row:2;background:linear-gradient(180deg,rgba(7,10,18,0) 0%,rgba(7,10,18,.92) 12%,rgba(7,10,18,.98) 100%);padding:14px 16px 20px;justify-content:flex-start;gap:14px}
  .title{font-size:21px}
  .menu-btns,.menu-row{max-width:none}
}
/* телефон в горизонтальном положении: всё меню помещается без прокрутки */
@media (max-height:540px) and (min-width:600px){
  .menu{grid-template-columns:minmax(360px,520px) 1fr}
  .menu-panel{gap:8px;padding:10px 16px 10px 20px;justify-content:center;scrollbar-width:none}
  .menu-panel::-webkit-scrollbar{display:none}
  .title{font-size:19px}
  .subtitle{display:none}
  .wallet{font-size:13px}.wallet b{font-size:16px}
  .menu-btns{display:grid;grid-template-columns:1fr 1fr;gap:7px;max-width:none}
  .menu-btns .btn{padding:7px 10px;font-size:14px;min-height:40px}
  .menu-btns .btn .k{display:none}
  .menu-row{gap:6px;max-width:none}
  .menu-row .btn{padding:5px 8px;font-size:12.5px;min-height:32px}
  .rank{font-size:12px}
}

/* ---------- сцена ---------- */
.scene{position:absolute;inset:0;background:var(--void)}
.scene canvas#cv{position:absolute;left:0;top:0;touch-action:none}
.wl{position:absolute;left:0;top:0;z-index:2;pointer-events:none;font:600 14px/1.2 var(--fpx);color:var(--amber2);background:rgba(7,10,18,.86);padding:4px 9px;border-radius:3px;white-space:nowrap;
  box-shadow:0 0 0 1px rgba(255,210,122,.28),0 3px 10px rgba(0,0,0,.5);display:none;will-change:transform}
.wl.on{display:block}
.wl.seen{color:#c3cadb;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 3px 10px rgba(0,0,0,.5)}
.wl.npc{color:var(--ink)}
.wl small{display:block;font:400 12px/1.2 var(--ftype);color:var(--dim)}
.rbanner{position:absolute;left:50%;top:16%;transform:translateX(-50%);z-index:2;pointer-events:none;text-align:center;opacity:0}
.rbanner.show{animation:rban 2.6s ease-out forwards}
.rbanner b{display:block;font:700 26px/1.15 var(--fpx);color:var(--ink);text-shadow:0 2px 0 #000,0 0 18px rgba(0,0,0,.9);letter-spacing:.3px}
.rbanner span{display:inline-block;margin-top:6px;font:600 13px/1 var(--fpx);color:#fff;background:var(--stamp);padding:4px 9px;letter-spacing:1px;text-transform:uppercase}
.rbanner span:empty{display:none}
@keyframes rban{0%{opacity:0;transform:translate(-50%,6px)}12%{opacity:1;transform:translate(-50%,0)}75%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.rbanner.show{animation:none;opacity:1}}
.hud-top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:10px;gap:10px;pointer-events:none;z-index:3}
.hud-loc{background:rgba(7,10,18,.84);padding:8px 12px;box-shadow:0 0 0 2px var(--void);pointer-events:auto;border-radius:3px}
.hud-loc .r{font:600 17px/1.15 var(--fpx);color:var(--ink)}
.hud-loc .c{font:400 13.5px/1.35 var(--ftype);color:var(--dim)}
.hud-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.hud-pills{display:flex;gap:6px}
.pill{background:rgba(7,10,18,.84);padding:6px 10px;font:600 14.5px/1.2 var(--fpx);color:var(--ink);box-shadow:0 0 0 2px var(--void);border-radius:3px}
.pill i{font:400 13px var(--ftype);font-style:normal;color:var(--dim);margin-right:6px}
.pill.combo{color:#24170a;background:var(--amber)}
#mini{width:140px;height:auto;background:rgba(7,10,18,.86);box-shadow:0 0 0 2px var(--void);pointer-events:auto;cursor:pointer;border-radius:3px}
.hud-bottom{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;padding:10px 12px 14px;gap:10px;z-index:3;pointer-events:none}
.hud-bottom > *{pointer-events:auto}
.hb-left{display:flex;gap:10px;align-items:flex-end}
.act{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);max-width:52vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act.hidden{display:none}
.act:active{transform:translate(-50%,3px)}
.nbcount{background:var(--amber);color:#24170a;padding:1px 7px;font-size:13px;border-radius:2px}
.keys{font:400 13.5px/1.6 var(--ftype);color:var(--dim);background:rgba(7,10,18,.78);padding:6px 11px;box-shadow:0 0 0 2px var(--void);border-radius:3px}
.keys b{color:var(--ink);font:600 12.5px var(--fpx);background:rgba(255,255,255,.1);padding:1px 5px;border-radius:2px;margin:0 2px}
.joywrap{display:none;align-items:flex-end;gap:12px}
.joy{position:relative;width:128px;height:128px;touch-action:none}
.joy-base{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(17,26,44,.55) 0 55%,rgba(242,169,59,.28) 56% 59%,rgba(7,10,18,.5) 60%)}
.joy-knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe3a0,#c8862a 70%);box-shadow:0 4px 0 #000;pointer-events:none}
.run{width:60px;height:60px;border-radius:50%;background:var(--night3);color:var(--amber2);font:700 13px var(--fpx);box-shadow:0 4px 0 #000;touch-action:none}
.run.on{background:var(--amber);color:#24170a;transform:translateY(3px);box-shadow:0 1px 0 #000}
@media (pointer:coarse){.joywrap{display:flex}.keys{display:none}#mini{width:108px}
  .act{left:auto;right:14px;bottom:152px;transform:none;max-width:46vw;min-height:52px;padding:12px 18px;border-radius:26px;font-size:16px}
  .act:active{transform:translateY(3px)}.wl{font-size:13px;padding:3px 8px}}
@media (max-width:900px){.keys{display:none}}
@media (max-width:420px){.joy{width:112px;height:112px}.joy-knob{width:48px;height:48px;margin:-24px 0 0 -24px}.run{width:50px;height:50px;font-size:12px}.hb-left .btn{padding:10px 10px}.act{bottom:136px;right:10px}}
@media (max-width:560px){.sheet .stamp{position:static;display:inline-block;margin:0 0 8px;transform:rotate(-3deg)}}
@media (max-width:560px){.hud-loc .c{display:none}.pill{font-size:13.5px;padding:5px 8px}.hud-bottom .btn{padding:10px 12px;font-size:15px}.rbanner b{font-size:21px}}

.coach{position:absolute;left:12px;bottom:80px;z-index:4;display:flex;gap:10px;align-items:flex-start;width:min(440px,calc(100% - 24px));background:rgba(13,20,36,.94);padding:10px 34px 10px 10px;border-radius:4px;
  box-shadow:0 0 0 2px var(--void),0 0 0 3px #ffd23a,0 8px 24px rgba(0,0,0,.5)}
.coach canvas{width:54px;height:54px;flex:0 0 auto;background:#1b2238;box-shadow:0 0 0 2px var(--void)}
.coach .cb b{display:block;font:700 14px var(--fpx);color:#ffd23a;margin-bottom:2px}
.coach .cb p{margin:0;font:15px/1.45 var(--ftype);color:var(--ink)}
.coach .cb small{display:block;margin-top:4px;font:500 12px var(--fpx);color:var(--dim)}
.coach .cx{position:absolute;right:6px;top:4px;width:24px;height:24px;font:700 18px/1 var(--fpx);color:var(--dim)}
.coach.min{width:auto;padding:6px 30px 6px 6px}.coach.min .cb{display:none}.coach.min canvas{width:36px;height:36px}
.coach.flash{animation:cflash .7s ease-out}
@keyframes cflash{0%{transform:scale(1.04);box-shadow:0 0 0 2px var(--void),0 0 0 5px #ffd23a,0 0 30px rgba(255,210,58,.6)}100%{transform:none}}
@media (pointer:coarse),(max-width:640px){.coach{left:10px;right:122px;top:58px;bottom:auto;width:auto;padding:8px 30px 8px 8px}.coach canvas{width:40px;height:40px}.coach .cb p{font-size:13.5px}}

/* ---------- оверлеи ---------- */
.overlay{position:absolute;inset:0;z-index:20;display:none}
.overlay.on{display:flex}
#modal{z-index:60;background:rgba(4,6,12,.76);align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.mbox{background:var(--night2);width:100%;max-width:560px;padding:22px;box-shadow:0 0 0 2px var(--void),0 0 0 4px var(--edge),0 12px 40px rgba(0,0,0,.6);margin:auto;animation:pop .18s ease-out;border-radius:3px}
.mbox h2{font:700 24px/1.2 var(--fpx);margin:0 0 10px;color:var(--ink)}
.mbox p{margin:0 0 12px;color:var(--ink);font-size:16.5px;line-height:1.55}
.mbox .muted{color:var(--dim);font-size:15px}
.mbox .row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.mbox .row .btn{flex:1}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.mbox{animation:none}}

/* карточка дела (вступление) — папка */
.file{background:var(--manila);color:var(--type);padding:0;max-width:600px;box-shadow:0 0 0 2px var(--void),0 16px 50px rgba(0,0,0,.7)}
.file-tab{display:inline-block;background:var(--manila);margin:-24px 0 0 18px;padding:7px 14px 3px;font:700 14px var(--fpx);color:var(--type);position:relative;top:0;border-radius:4px 4px 0 0}
.file-in{padding:6px 20px 20px}
.file h2{color:var(--type);font:700 26px/1.15 var(--fpx);margin:6px 0 4px}
.file .muted{color:var(--typeD)!important;font-size:15px}
.sheet{background:var(--paper);padding:16px 18px;margin-top:10px;font:16.5px/1.62 var(--fdoc);color:var(--type);box-shadow:2px 3px 0 rgba(0,0,0,.18);position:relative}
.sheet p{margin:0 0 9px;color:var(--type)}
.sheet .theme{display:inline-block;font:600 13px/1.2 var(--fpx);color:#fff;background:#5a3a8a;padding:3px 8px;margin-bottom:8px;border-radius:2px}
.stamp{position:absolute;right:12px;top:10px;font:800 16px/1 var(--fpx);color:var(--stamp);border:3px solid var(--stamp);padding:5px 8px;transform:rotate(-7deg);opacity:.85;letter-spacing:1px;text-transform:uppercase}
.file .btn.primary{margin-top:14px}

/* ---------- блокнот ---------- */
#nb{background:rgba(4,6,12,.6);align-items:stretch;justify-content:center}
.nb{position:relative;display:flex;flex-direction:column;width:100%;max-width:1040px;height:100%;background:var(--manila);color:var(--type);box-shadow:0 0 0 2px var(--void),0 20px 60px rgba(0,0,0,.6)}
.nb-head{display:flex;align-items:center;gap:10px;padding:12px 14px 0}
.nb-head h3{flex:1;margin:0;font:700 19px/1.2 var(--fpx);color:var(--type)}
.nb-head .btn{background:var(--type);color:var(--paper)}
.nb-tabs{display:flex;gap:4px;padding:10px 12px 0;overflow-x:auto;scrollbar-width:none}
.nb-tabs::-webkit-scrollbar{display:none}
.nb-tab{flex:0 0 auto;font:600 15px/1 var(--fpx);padding:11px 14px 10px;background:var(--manilaD);color:rgba(36,29,20,.82);border-radius:4px 4px 0 0}
.nb-tab.on{background:var(--paper);color:var(--type)}
.nb-tab .n{font-size:12px;margin-left:6px;opacity:.75}
.nb-body{flex:1;min-height:0;overflow-y:auto;background:var(--paper);margin:0 12px 12px;padding:18px;font:16px/1.6 var(--ftype);color:var(--type);-webkit-overflow-scrolling:touch}
.nb-body h4{font:700 17px/1.25 var(--fpx);margin:18px 0 9px;color:var(--type)}
.nb-body h4:first-child{margin-top:0}
.nb-body .note{color:var(--typeD);font-size:15px}
.nb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:#faf2dc;padding:11px 13px;box-shadow:1px 2px 0 rgba(0,0,0,.14);position:relative;border-radius:2px}
.card.click{cursor:pointer}
.card.click:hover{background:#fff8e6}
.pcard{display:flex;gap:11px;align-items:flex-start}
.pcard canvas{width:68px;height:68px;flex:0 0 auto;background:#1b2238}
.pcard .nm{font:600 16px/1.2 var(--fpx)}
.pcard .rl{font-size:14px;color:var(--typeD);line-height:1.4}
.pcard .tr{font-size:14px;margin-top:4px}
.mark{position:absolute;right:8px;top:8px;font:700 12px var(--fpx);padding:2px 6px;border-radius:2px}
.mark.sus{background:var(--stamp);color:#fff}
.mark.clr{background:#3f6e3c;color:#fff}
.tag{display:inline-block;font:500 13px/1.3 var(--fpx);padding:2px 7px;margin:3px 4px 0 0;background:rgba(36,29,20,.1);color:#3a2f20;border-radius:2px}
.tag.red{background:rgba(179,54,42,.16);color:#7e1f15}
.tag.green{background:rgba(60,110,52,.18);color:#244a20}
.tag.amber{background:rgba(200,130,30,.22);color:#5e3e0a}
.ev{display:flex;gap:11px;align-items:flex-start}
.ev img{width:40px;height:40px;flex:0 0 auto;background:#1b2238;padding:4px}
.ev .nm{font:600 15.5px/1.25 var(--fpx);padding-right:20px}
.ev .ds{font:15px/1.5 var(--fdoc);margin-top:3px}
.ev .wh{font-size:13.5px;color:var(--typeD);margin-top:4px}
.ev .star{position:absolute;right:6px;top:6px;font:700 18px var(--fpx);color:#b8a37a;padding:2px 4px}
.ev .star.on{color:var(--stamp)}
.qlist{margin:0;padding:0;list-style:none}
.qlist li{display:flex;gap:8px;padding:6px 0;border-bottom:1px dashed rgba(36,29,20,.22)}
.qlist li .ck{flex:0 0 18px;font:700 15px var(--fpx)}
.qlist li.done{color:var(--typeD);text-decoration:line-through}
/* хронология */
.tl{position:relative;margin-top:8px}
.tl-axis{position:relative;height:24px;margin-left:130px;border-bottom:2px solid var(--type)}
.tl-axis span{position:absolute;bottom:3px;font:500 12.5px var(--fpx);transform:translateX(-50%);color:#3a2f20}
.tl-row{display:flex;align-items:center;min-height:40px;border-bottom:1px dashed rgba(36,29,20,.2)}
.tl-name{flex:0 0 130px;font:600 14.5px/1.15 var(--fpx);padding-right:6px}
.tl-name small{display:block;font:400 12.5px var(--ftype);color:var(--typeD)}
.tl-track{position:relative;flex:1;height:38px}
.tl-win{position:absolute;top:0;bottom:0;background:rgba(179,54,42,.13);border-left:2px solid rgba(179,54,42,.55);border-right:2px solid rgba(179,54,42,.55)}
.tl-bar{position:absolute;height:10px;cursor:pointer}
.tl-bar.claim{top:6px;background:repeating-linear-gradient(90deg,currentColor 0 6px,transparent 6px 9px);opacity:.8}
.tl-bar.fact{top:21px}
.tl-dot{position:absolute;top:19px;width:10px;height:14px;margin-left:-5px;cursor:pointer}
.tl-lie{position:absolute;right:0;top:2px;font:700 11.5px var(--fpx);color:#fff;background:var(--stamp);padding:1px 5px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:14px}

<script>
"use strict";
/* ======================================================================
   НОЧНОЙ СЫЩИК v2 — логические дела, тайловая карта, ночной свет.
   Один файл, без внешних скриптов. Яндекс SDK подхватывается, если есть.
   ====================================================================== */

/* ---------- утилиты ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let _rnd=Math.random;
const setSeed=s=>{_rnd=mulberry32(s>>>0)};
const rnd=()=>_rnd();
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const pick=a=>a[Math.floor(rnd()*a.length)];
function shuffle(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=r[i];r[i]=r[j];r[j]=t}return r}
const pickN=(a,n)=>shuffle(a).slice(0,n);
const pad=n=>String(n).padStart(2,'0');
const hm=m=>{m=((Math.round(m)%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)};
const r5=m=>Math.round(m/5)*5;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
function todayKey(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function hsh(n){n|=0;n=Math.imul(n^n>>>15,0x85ebca6b);n=Math.imul(n^n>>>13,0xc2b2ae35);return((n^n>>>16)>>>0)/4294967296}
function strHash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
/* род: G(person,'был','была') */
const G=(p,m,f)=>p&&p.female?f:m;
const clone=o=>JSON.parse(JSON.stringify(o));

/* ---------- сохранение ---------- */
const SAVE_KEY='nochnoy_syshchik_v2';
const OLD_SAVE_KEYS=['detective_uncovered_save_v16'];
const DEFAULT_SAVE={
  score:0,coins:0,solved:0,attempts:0,correct:0,wrong:0,ideal:0,evidenceFound:0,lies:0,bonuses:0,best:0,
  ach:{},flags:{},caseCounter:0,hints:{hint:1,clue:0,solution:0},dailyStreak:0,lastDaily:'',
  minigames:[],comboMax:0,idealStreak:0,
  settings:{sound:true,music:true,rain:true},leaderboard:[],adsWatched:0,history:[],locs:{},
  skin:{hat:'fedora_gray',coat:'coat_trench',face:'face_clean'},
  owned:['fedora_gray','coat_gray','coat_trench','face_clean'],
  music:{owned:['noir','tension','jazz_soft'],active:['noir','tension','jazz_soft'],current:'noir'},
  bonusDone:{},bonusOwned:[],adUnlock:{},
  vkMissions:{},vkMissionQueue:[]
};
function deepMerge(base,over){
  if(!over||typeof over!=='object')return base;
  for(const k in over){
    const v=over[k];
    if(v&&typeof v==='object'&&!Array.isArray(v)&&base[k]&&typeof base[k]==='object'&&!Array.isArray(base[k]))deepMerge(base[k],v);
    else base[k]=v;
  }
  return base;
}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
let SAVE=(function(){
  const fresh=clone(DEFAULT_SAVE);
  const raw=lsGet(SAVE_KEY);
  if(raw){try{return deepMerge(fresh,JSON.parse(raw))}catch(e){}}
  /* перенос прогресса из старой версии: монеты, покупки, рекорды */
  for(const k of OLD_SAVE_KEYS){
    const o=lsGet(k);if(!o)continue;
    try{
      const old=JSON.parse(o);
      ['score','coins','solved','attempts','correct','best','dailyStreak','lastDaily','adsWatched','caseCounter','comboMax','bonuses'].forEach(f=>{if(typeof old[f]===typeof fresh[f])fresh[f]=old[f]});
      if(old.hints)['hint','clue','solution'].forEach(h=>{if(typeof old.hints[h]==='number')fresh.hints[h]=old.hints[h]});
      if(Array.isArray(old.owned))fresh.owned=[...new Set(fresh.owned.concat(old.owned))];
      if(old.skin){if(old.skin.hat)fresh.skin.hat=old.skin.hat;if(old.skin.coat)fresh.skin.coat=old.skin.coat;if(old.skin.face)fresh.skin.face=old.skin.face}
      if(old.music&&Array.isArray(old.music.owned))fresh.music.owned=[...new Set(fresh.music.owned.concat(old.music.owned))];
      if(old.settings&&typeof old.settings.sound==='boolean'){fresh.settings.sound=old.settings.sound;fresh.settings.music=old.settings.sound}
      if(Array.isArray(old.leaderboard))fresh.leaderboard=old.leaderboard.slice(0,50);
      if(old.flags&&old.flags.tutorialDone)fresh.flags.tutorialDone=true;
      fresh.flags.migrated=true;
    }catch(e){}
    break;
  }
  return fresh;
})();
let _saveT=null;
function save(){SAVE.ts=Date.now();if(_saveT)return;_saveT=setTimeout(()=>{_saveT=null;lsSet(SAVE_KEY,JSON.stringify(SAVE));if(window.__cloudPush)window.__cloudPush()},250)}
function saveNow(){SAVE.ts=Date.now();if(_saveT){clearTimeout(_saveT);_saveT=null}lsSet(SAVE_KEY,JSON.stringify(SAVE));if(window.__cloudPush)window.__cloudPush(true)}

/* ---------- звук ---------- */
let AC=null,MASTER=null,SFXBUS=null;
const volOf=k=>{const v=SAVE.settings[k==='music'?'musicVol':'sfxVol'];return typeof v==='number'?clamp(v,0,1):(k==='music'?.7:.9)};
function applyVolume(){try{if(SFXBUS)SFXBUS.gain.value=volOf('sfx');if(MUSIC.out)MUSIC.out.gain.value=.8*volOf('music')}catch(e){}}
function audioInit(){
  if(AC)return;
  try{AC=new(window.AudioContext||window.webkitAudioContext)();MASTER=AC.createGain();MASTER.gain.value=.9;MASTER.connect(AC.destination);SFXBUS=AC.createGain();SFXBUS.gain.value=volOf('sfx');SFXBUS.connect(MASTER)}catch(e){AC=null}
}
function audioResume(){if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}}
function beep(f,d,type,v,delay){
  if(!SAVE.settings.sound)return;audioInit();if(!AC)return;
  try{
    const t0=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t0);
    g.gain.setValueAtTime(v||.05,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(g);g.connect(SFXBUS||MASTER);o.start(t0);o.stop(t0+d+.03);
  }catch(e){}
}
let _noiseBuf=null;
function noiseBuf(){if(_noiseBuf&&_noiseBuf._ac===AC)return _noiseBuf;const len=AC.sampleRate*2,b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;b._ac=AC;_noiseBuf=b;return b}
function noiseHit(dur,vol,freq,type,delay){
  if(!SAVE.settings.sound)return;audioInit();if(!AC)return;
  try{const t0=AC.currentTime+(delay||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
    s.buffer=noiseBuf();f.type=type||'lowpass';f.frequency.value=freq||800;
    g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(vol,t0+Math.min(.08,dur*.2));g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    s.connect(f);f.connect(g);g.connect(SFXBUS||MASTER);s.start(t0);s.stop(t0+dur+.05)}catch(e){}
}
const SFX={
  click(){beep(640,.035,'square',.018)},
  find(){beep(660,.08,'triangle',.05);beep(990,.15,'triangle',.05,.08)},
  page(){noiseHit(.12,.05,2400,'bandpass')},
  good(){beep(523,.09,'triangle',.05);beep(784,.16,'triangle',.05,.09)},
  bad(){beep(196,.24,'sawtooth',.035)},
  lie(){[466,392,311].forEach((f,i)=>beep(f,.2,'square',.032,i*.1));noiseHit(.3,.06,300,'lowpass',.32)},
  stamp(){noiseHit(.14,.18,500,'lowpass');beep(90,.15,'sine',.12)},
  open(){beep(300,.1,'sine',.04);beep(450,.12,'sine',.04,.08)},
  ach(){[660,880,1100,1320].forEach((f,i)=>beep(f,.15,'sine',.045,i*.09))},
  type(){beep(1500+Math.random()*500,.012,'square',.006)},
  step(){},
  thunder(){noiseHit(2.2,.22,160,'lowpass');noiseHit(1.2,.08,90,'lowpass',.2)}

   (скрипт /sdk.js загружается автоматически, если игра открыта на домене Яндекса).
   Можно и вручную: добавьте в head тег script с адресом /sdk.js (так советует документация Яндекса).
   Все места показа рекламы собраны в AD_CFG — их можно включать и выключать.  */
/* Платформа сборки: 'yandex' или 'vk'. Сборка для VK Игр меняет эту строку и встраивает VK Bridge. */
const PLATFORM='vk';
/* Куда писать в поддержку (VK требует, чтобы в игре был способ связаться с разработчиком): ссылка на сообщество, страницу или mailto: */
const SUPPORT_URL='';
/* URL бэкенда миссий (missions/server). Пустая строка = только локальная отметка, без ленты друзей. */
const MISSION_API_URL=typeof window!=='undefined'&&window.MISSION_API_URL||'';
const IN_VK=PLATFORM==='vk'&&!!window.vkBridge&&/[?&]vk_(app_id|platform)=/.test(location.search);
const AD_CFG={
  interstitial:true,      // полноэкранная реклама между делами (после итогов и перед новым делом)
  interGapSec:90,         // не чаще, чем раз в N секунд (Яндекс сам не даст чаще 60 с)
  interSkipFirst:1,       // не показывать после первых N дел за сессию — пусть игрок втянется
  stickyBanner:true,      // стики-баннер Яндекса в меню и на страницах (в расследовании скрыт)
  placeholders:PLATFORM==='vk'?!IN_VK:!/yandex|playhop|games\.s3/.test(location.hostname) // вне платформы показывать заглушки, чтобы видеть места показа
};
const SDK={
  ysdk:null,vk:false,_loading:false,_initing:false,paused:false,
  init(){
    try{
      if(PLATFORM==='vk'){if(this.vk||!IN_VK)return;this.vk=true;VKP.init();return}
      if(this.ysdk)return;
      if(window.YaGames&&YaGames.init){if(this._initing)return;this._initing=true;
        YaGames.init().then(s=>{this.ysdk=window.ysdk=s;this.onReady()}).catch(()=>{this._initing=false});return}
      /* скрипт /sdk.js: в архиве для Яндекса он подключён тегом в head, иначе подгружаем сами (только на доменах Яндекса) */
      if(!AD_CFG.placeholders&&!this._loading&&!document.querySelector('script[src="/sdk.js"]')){this._loading=true;const sc=document.createElement('script');sc.src='/sdk.js';sc.async=true;sc.onload=()=>this.init();document.head.appendChild(sc)}
    }catch(e){}
  },
  onReady(){const s=this.ysdk;
    try{if(s.on){s.on('game_api_pause',()=>this.pause());s.on('game_api_resume',()=>this.resume())}}catch(e){}
    try{s.features&&s.features.LoadingAPI&&s.features.LoadingAPI.ready()}catch(e){}
    ADS.banner(STATE.screen!=='scene');CLOUD.init(s);
  },
  /* платформа просит паузу (реклама при запуске, окно покупки, сворачивание): тишина и стоп игрового процесса */
  pause(){this.paused=true;try{MUSIC.stop();AMB.stop();if(AC)AC.suspend()}catch(e){}},
  resume(){this.paused=false;if(ADS.busy)return;try{if(AC)AC.resume();if(SAVE.settings.music&&_audioUnlocked)MUSIC.start();if(STATE.screen==='scene')AMB.start(.03)}catch(e){}},
  ready(){return this.ysdk||null},
  /* Яндекс просит сообщать, когда идёт сам геймплей */
  gameplay(on){const y=this.ready();try{const g=y&&y.features&&y.features.GameplayAPI;if(g)on?g.start():g.stop()}catch(e){}}
};
window.__ysdkLoad=()=>SDK.init();
/* ---------- VK Игры: VK Bridge ----------
   Запуск: VKWebAppInit сразу после загрузки. Сворачивание — VKWebAppViewHide/Restore (пауза и тишина).
   Реклама: VKWebAppCheckNativeAds заранее, VKWebAppShowNativeAds — interstitial и reward, баннер VKWebAppShowBannerAd.
   Уведомления: VKWebAppAllowNotifications (иначе кабинетные пуши неактивным не дойдут).
   Сохранения: VKWebAppStorage (значение до 4096 байт, поэтому сохранение сжимается и режется на куски). */
const VKP={
  ads:{interstitial:false,reward:false},
  send(m,p,ms){return Promise.race([vkBridge.send(m,p||{}),new Promise((_,j)=>setTimeout(()=>j(new Error('timeout '+m)),ms||15000))])},
  init(){
    this.send('VKWebAppInit',{},8000).catch(()=>{});
    try{vkBridge.subscribe(e=>{const t=e&&e.detail&&e.detail.type;if(t==='VKWebAppViewHide')SDK.pause();else if(t==='VKWebAppViewRestore')SDK.resume()})}catch(e){}
    this.check('interstitial');this.check('reward');
    setInterval(()=>{if(!this.ads.interstitial)this.check('interstitial');if(!this.ads.reward)this.check('reward')},30000);
    CLOUD.initVK();
    if(this.notifEnabled()){SAVE.flags=SAVE.flags||{};SAVE.flags.notifOn=true}
    setTimeout(()=>{try{VKM.check();VKM.flushQueue()}catch(e){}},1200);
  },
  check(f){return this.send('VKWebAppCheckNativeAds',{ad_format:f},12000).then(r=>{this.ads[f]=!!(r&&r.result);return this.ads[f]}).catch(()=>false)},
  async show(f){let ok=false;try{if(!this.ads[f]&&!(await this.check(f)))return null;const d=await this.send('VKWebAppShowNativeAds',{ad_format:f},60000);ok=!!(d&&d.result)}catch(e){ok=null}
    this.ads[f]=false;setTimeout(()=>this.check(f),1500);return ok},
  invite(){this.send('VKWebAppShowInviteBox',{},120000).catch(()=>{})},
  leaderboard(score){const p={};if(score!=null)p.user_result=Math.max(0,Math.floor(score));this.send('VKWebAppShowLeaderBoardBox',p,60000).catch(()=>{})},
  /* vk_are_notifications_enabled=1 в launch-параметрах */
  notifEnabled(){try{return new URLSearchParams(location.search).get('vk_are_notifications_enabled')==='1'}catch(e){return false}},
  notifOn(){return this.notifEnabled()||!!(SAVE.flags&&SAVE.flags.notifOn)},
  /* мягкий запрос после первого дела; force=true из настроек */
  async askNotifications(force){
    if(PLATFORM!=='vk'||!SDK.vk)return false;
    if(this.notifEnabled()){SAVE.flags.notifOn=true;save();return true}
    if(!force&&SAVE.flags&&SAVE.flags.notifAsked)return false;
    if(!force&&!(SAVE.flags&&SAVE.flags.tutorialDone)&&!(SAVE.solved>=1))return false;
    try{
      const r=await this.send('VKWebAppAllowNotifications',{},60000);
      SAVE.flags.notifAsked=true;
      const ok=!!(r&&(r.result===true||r.result===1));
      if(ok){SAVE.flags.notifOn=true;UI.toast('Напомним о деле дня, если не зайдёте','green')}
      save();return ok;
    }catch(e){SAVE.flags.notifAsked=true;save();return false}
  },
  maybeAskNotifications(){
    if(PLATFORM!=='vk'||!SDK.vk||this.notifOn()||(SAVE.flags&&SAVE.flags.notifAsked))return;
    if(!(SAVE.flags&&SAVE.flags.tutorialDone)&&!(SAVE.solved>=1))return;
    setTimeout(()=>{this.askNotifications(false).catch(()=>{})},1600);
  }
};
/* ---------- VK миссии (лента друзей) ----------
   Каталог: missions/catalog.json. В кабинете создаёте миссии → получаете activity_id → ids.json.
   Закрытие миссии на стороне VK: только серверным secure.addAppEvent (missions/server).
   Клиент проверяет условия, шлёт POST /complete с launch-параметрами. */
const VKM={
  defs:[
    {key:'tutorial',n:'пройти обучение сыщика',pts:20,ck:s=>!!(s.flags&&s.flags.tutorialDone)},
    {key:'first_case',n:'раскрыть первое дело',pts:35,ck:s=>(s.solved||0)>=1},
    {key:'ideal',n:'провести блестящее раскрытие',pts:45,ck:s=>(s.ideal||0)>=1},
    {key:'liar',n:'поймать лжеца на допросе',pts:30,ck:s=>(s.lies||0)>=1},
    {key:'all_evidence',n:'найти все улики в деле',pts:35,ck:(s,r)=>!!(r&&r.allEv&&r.tier&&r.tier!=='wrong')||!!(s.flags&&s.flags.mission_all_evidence)},
    {key:'all_rooms',n:'осмотреть все помещения',pts:30,ck:(s,r)=>!!(r&&r.allRooms&&r.tier&&r.tier!=='wrong')||!!(s.flags&&s.flags.mission_all_rooms)},
    {key:'daily1',n:'раскрыть дело дня',pts:40,ck:s=>!!(s.flags&&s.flags.mission_daily1)},
    {key:'cases5',n:'раскрыть пять дел',pts:45,ck:s=>(s.solved||0)>=5},
    {key:'cases10',n:'раскрыть десять дел',pts:55,ck:s=>(s.solved||0)>=10},
    {key:'cases25',n:'раскрыть двадцать пять дел',pts:70,ck:s=>(s.solved||0)>=25},
    {key:'cases50',n:'раскрыть пятьдесят дел',pts:90,ck:s=>(s.solved||0)>=50},
    {key:'daily3',n:'держать серию дел дня три дня',pts:50,ck:s=>(s.dailyStreak||0)>=3},
    {key:'daily7',n:'держать серию дел дня неделю',pts:75,ck:s=>(s.dailyStreak||0)>=7},
    {key:'bonus1',n:'раскрыть бонусное дело',pts:40,ck:s=>Object.keys(s.bonusDone||{}).length>=1},
    {key:'bonus_book',n:'раскрыть все книжные дела',pts:55,ck:s=>typeof bonusCatDone==='function'&&bonusCatDone(s,'book')},
    {key:'bonus_series',n:'раскрыть все сериальные дела',pts:55,ck:s=>typeof bonusCatDone==='function'&&bonusCatDone(s,'series')},
    {key:'bonus_all',n:'раскрыть все бонусные дела',pts:100,ck:s=>typeof BONUS!=='undefined'&&BONUS.every(b=>(s.bonusDone||{})[b.id])},
    {key:'genius',n:'раскрыть дело на сложности Гений',pts:80,ck:(s,r)=>!!(s.flags&&s.flags.mission_genius)||!!(r&&r.tier!=='wrong'&&r.tier!=='weak'&&r.diff==='genius')},
    {key:'nohint',n:'раскрыть сложное дело без подсказок',pts:70,ck:(s,r)=>!!(s.flags&&s.flags.mission_nohint)||!!(r&&(r.tier==='ideal'||r.tier==='solved')&&r.hints===0&&typeof DIFF_ORDER!=='undefined'&&DIFF_ORDER.indexOf(r.diff)>=3)},
    {key:'locs8',n:'раскрыть дела в восьми местах',pts:55,ck:s=>Object.keys(s.locs||{}).length>=8},
    {key:'crimes4',n:'раскрыть все типы преступлений',pts:50,ck:s=>['murder','theft','forgery','sabotage'].every(k=>s.flags&&s.flags['crime_'+k])},
    {key:'night',n:'раскрыть дело ночной сменой',pts:35,ck:s=>!!(s.flags&&s.flags.nightOwl)},
    {key:'ideal3',n:'сделать три блестящих раскрытия подряд',pts:65,ck:s=>(s.idealStreak||0)>=3},
    {key:'score10k',n:'набрать десять тысяч очков',pts:70,ck:s=>(s.score||0)>=10000},
    {key:'wardrobe',n:'купить вещь в гардеробе',pts:25,ck:s=>{try{return (s.owned||[]).some(id=>{const f=shopItem(id);return f&&f.it[2]>0})}catch(e){return false}}},
    {key:'music',n:'купить трек для расследования',pts:25,ck:s=>{try{return (s.music.owned||[]).some(id=>findTrack(id).price>0)}catch(e){return false}}}
  ],
  points(){const md=SAVE.vkMissions||{};return this.defs.reduce((s,d)=>s+(md[d.key]?d.pts:0),0)},
  busy:Object.create(null),
  rememberFlags(r){
    if(!r)return;
    if(r.allEv&&r.tier!=='wrong')SAVE.flags.mission_all_evidence=true;
    if(r.allRooms&&r.tier!=='wrong')SAVE.flags.mission_all_rooms=true;
    if(r.c&&r.c.mode==='daily'&&r.tier!=='wrong')SAVE.flags.mission_daily1=true;
    if(r.tier!=='wrong'&&r.tier!=='weak'&&r.diff==='genius')SAVE.flags.mission_genius=true;
    if((r.tier==='ideal'||r.tier==='solved')&&r.hints===0&&typeof DIFF_ORDER!=='undefined'&&DIFF_ORDER.indexOf(r.diff)>=3)SAVE.flags.mission_nohint=true;
  },
  check(r){
    this.rememberFlags(r);
    if(!SAVE.vkMissions)SAVE.vkMissions={};
    let n=0;
    this.defs.forEach(m=>{
      if(SAVE.vkMissions[m.key])return;
      let ok=false;try{ok=!!m.ck(SAVE,r)}catch(e){}
      if(!ok)return;
      SAVE.vkMissions[m.key]=Date.now();
      n++;
      setTimeout(()=>{SFX.ach&&SFX.ach();UI.toast('Миссия: '+m.n,'green')},350*n);
      this.send(m.key);
    });
    if(n)save();
  },
  async send(key){
    if(!MISSION_API_URL){
      /* без сервера миссия остаётся локальной — лента друзей не обновится */
      if(!SAVE.vkMissionQueue)SAVE.vkMissionQueue=[];
      if(!SAVE.vkMissionQueue.includes(key)){SAVE.vkMissionQueue.push(key);save()}
      return;
    }
    if(this.busy[key])return;this.busy[key]=true;
    try{
      const res=await fetch(String(MISSION_API_URL).replace(/\/$/,'')+'/complete',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({key,search:location.search||''})
      });
      const data=await res.json().catch(()=>({}));
      if(data&&data.ok){
        if(SAVE.vkMissionQueue){SAVE.vkMissionQueue=SAVE.vkMissionQueue.filter(k=>k!==key);save()}
      }else if(data&&data.error==='mission id not mapped'){
        if(!SAVE.vkMissionQueue)SAVE.vkMissionQueue=[];
        if(!SAVE.vkMissionQueue.includes(key)){SAVE.vkMissionQueue.push(key);save()}
      }
    }catch(e){
      if(!SAVE.vkMissionQueue)SAVE.vkMissionQueue=[];
      if(!SAVE.vkMissionQueue.includes(key)){SAVE.vkMissionQueue.push(key);save()}
    }finally{this.busy[key]=false}
  },
  flushQueue(){
    const q=(SAVE.vkMissionQueue||[]).slice();
    q.forEach(k=>this.send(k));
  }
};
/* упаковка сохранения: JSON → deflate → base64 (без CompressionStream — просто base64) */
const b64e=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const b64d=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
async function packSave(str){try{if(window.CompressionStream){const st=new Blob([str]).stream().pipeThrough(new CompressionStream('deflate-raw'));return {z:1,s:b64e(new Uint8Array(await new Response(st).arrayBuffer()))}}}catch(e){}
  return {z:0,s:b64e(new TextEncoder().encode(str))}}
async function unpackSave(s,z){const u=b64d(s);if(z){const st=new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return await new Response(st).text()}return new TextDecoder().decode(u)}
const CLOUD={player:null,ready:false,last:0,timer:null,
  async init(y){
    try{this.player=await y.getPlayer();const d=await this.player.getData(['save']);const cs=d&&d.save;
      this.adopt(cs);this.ready=true;this.push(true);LB.push()}catch(e){}
  },
  /* очки и раскрытые дела только растут, поэтому побеждает сохранение, где их больше; «чистое» локальное всегда уступает облаку */
  adopt(cs){if(!cs||typeof cs!=='object')return;
    const pristine=!SAVE.score&&!SAVE.solved&&!(SAVE.flags&&SAVE.flags.tutorialDone);
    const better=(cs.score||0)>(SAVE.score||0)||((cs.score||0)===(SAVE.score||0)&&(cs.solved||0)>(SAVE.solved||0))||(pristine&&((cs.score||0)>0||(cs.flags&&cs.flags.tutorialDone)));
    if(better&&STATE.screen!=='scene'){const fresh=deepMerge(clone(DEFAULT_SAVE),cs);Object.keys(SAVE).forEach(k=>delete SAVE[k]);Object.assign(SAVE,fresh);
      lsSet(SAVE_KEY,JSON.stringify(SAVE));UI.render();UI.toast('Прогресс загружен из облака','green')}},
  /* VK: метаданные в sv_meta, само сохранение кусками sv_0…sv_N */
  vk:false,_prev:[],
  async initVK(){
    try{const m=await VKP.send('VKWebAppStorageGet',{keys:['sv_meta']});const mv=m&&m.keys&&m.keys[0]&&m.keys[0].value;
      if(mv){const meta=JSON.parse(mv),ks=[];for(let i=0;i<meta.n;i++)ks.push('sv_'+i);
        const r=await VKP.send('VKWebAppStorageGet',{keys:ks}),map={};(r.keys||[]).forEach(k=>map[k.key]=k.value);
        const parts=ks.map(k=>map[k]||'');this._prev=parts.slice();
        if(parts.every(Boolean))this.adopt(JSON.parse(await unpackSave(parts.join(''),meta.z)))}
      this.vk=true;this.ready=true;this.push(true)}catch(e){}
  },
  async pushVK(){
    const o=JSON.parse(JSON.stringify(SAVE));let pk,parts;
    for(const keep of [60,25,8,0]){o.archive=(SAVE.archive||[]).slice(-keep);o.history=(SAVE.history||[]).slice(-keep);
      pk=await packSave(JSON.stringify(o));parts=pk.s.match(/[\s\S]{1,3800}/g)||[''];if(parts.length<=40)break}
    for(let i=0;i<parts.length;i++)if(this._prev[i]!==parts[i]){await VKP.send('VKWebAppStorageSet',{key:'sv_'+i,value:parts[i]});this._prev[i]=parts[i]}
    await VKP.send('VKWebAppStorageSet',{key:'sv_meta',value:JSON.stringify({n:parts.length,z:pk.z,ts:SAVE.ts||Date.now(),score:SAVE.score||0,solved:SAVE.solved||0})});
    this._prev.length=parts.length},
  push(soon){if(this.vk){if(!this.ready)return;clearTimeout(this.timer);
      /* лимит VK — 1000 записей в час на игрока, поэтому пишем не чаще раза в 20–60 с */
      const gap=Math.max(soon?20000:60000,(this._prev.length+1)*8000);
      this.timer=setTimeout(()=>{this.last=Date.now();this.pushVK().catch(()=>{})},Math.max(soon?400:5000,gap-(Date.now()-this.last)));return}
    if(!this.ready||!this.player)return;clearTimeout(this.timer);
    const go=()=>{this.last=Date.now();try{const o=JSON.parse(JSON.stringify(SAVE));if(JSON.stringify(o).length>150000){o.archive=(o.archive||[]).slice(-25);o.history=(o.history||[]).slice(-25)}
      const r=this.player.setData({save:o},true);if(r&&r.catch)r.catch(()=>{})}catch(e){}};
    this.timer=setTimeout(go,Math.max(soon?300:4000,8000-(Date.now()-this.last)))}
};
window.__cloudPush=soon=>CLOUD.push(soon);
const ADS={
  lastInter:Date.now(),busy:false,_banner:null,casesThisSession:0,
  pauseAll(){MUSIC.stop();AMB.stop();if(AC)try{AC.suspend()}catch(e){}},
  resumeAll(){if(AC)try{AC.resume()}catch(e){}if(SAVE.settings.music)MUSIC.start();if(STATE.screen==='scene')AMB.start(.03)},
  async rewarded(title){
    if(this.busy)return false;this.busy=true;const y=SDK.ready();let ok;
    if(SDK.vk){this.pauseAll();ok=await VKP.show('reward');this.resumeAll();
      if(ok){SAVE.adsWatched=(SAVE.adsWatched||0)+1;save()}else if(ok===null)UI.toast('Реклама сейчас недоступна — попробуйте чуть позже','red')}
    else if(y&&y.adv&&y.adv.showRewardedVideo){
      this.pauseAll();SDK.gameplay(false);
      ok=await new Promise(res=>{let got=false;try{y.adv.showRewardedVideo({callbacks:{onRewarded:()=>{got=true},onClose:()=>res(got),onError:()=>res(false)}})}catch(e){res(false)}});
      this.resumeAll();if(ok){SAVE.adsWatched=(SAVE.adsWatched||0)+1;save()}
    }else if(AD_CFG.placeholders)ok=await this.simulate(title,5,'Реклама за награду');
    else{UI.toast('Реклама сейчас недоступна — попробуйте чуть позже','red');ok=null}
    this.busy=false;this.lastInter=Date.now();return ok;
  },
  /* полноэкранная реклама на переходах между экранами */
  async interstitial(){
    if(!AD_CFG.interstitial||this.busy)return;
    if(this.casesThisSession<=AD_CFG.interSkipFirst)return;
    if((Date.now()-this.lastInter)/1000<AD_CFG.interGapSec)return;
    this.busy=true;this.lastInter=Date.now();const y=SDK.ready();
    if(SDK.vk){this.pauseAll();await VKP.show('interstitial');this.resumeAll()}
    else if(y&&y.adv&&y.adv.showFullscreenAdv){
      this.pauseAll();
      await new Promise(res=>{try{y.adv.showFullscreenAdv({callbacks:{onClose:()=>res(),onError:()=>res(),onOffline:()=>res()}})}catch(e){res()}});
      this.resumeAll();
    }else if(AD_CFG.placeholders)await this.simulate('Здесь будет полноэкранная реклама',2,'Межстраничная реклама');
    this.busy=false;
  },
  banner(show){
    /* VK: баннер снизу, и только после первого раскрытого дела — не сразу после запуска */
    if(SDK.vk){show=show&&this.casesThisSession>=1;if(!AD_CFG.stickyBanner||this._banner===show)return;this._banner=show;
      VKP.send(show?'VKWebAppShowBannerAd':'VKWebAppHideBannerAd',show?{banner_location:'bottom'}:{}).catch(()=>{});return}
    if(!AD_CFG.stickyBanner||this._banner===show)return;const y=SDK.ready();if(!y||!y.adv)return;this._banner=show;
    try{if(!show){y.adv.hideBannerAdv();return}
      const st=y.adv.getBannerAdvStatus?y.adv.getBannerAdvStatus():null;
      if(st&&st.then)st.then(r=>{if(r&&!r.stickyAdvIsShowing&&!r.reason)y.adv.showBannerAdv()}).catch(()=>{});else y.adv.showBannerAdv()}catch(e){}
  },
  simulate(title,sec,kind){
    return new Promise(res=>{
      let c=sec;

      const iv=setInterval(()=>{c--;const t=$('adt'),b=$('adb');if(t)t.textContent=c;if(b)b.style.width=((sec-c)/sec*100)+'%';
        if(c<=0){clearInterval(iv);SAVE.adsWatched=(SAVE.adsWatched||0)+1;save();UI.closeModal(true);res(true)}},1000);
    });
  }
};

/* ======================= ГЕРОИ БОНУСНЫХ ДЕЛ =======================
   Подозреваемые, свидетели и жертва — персонажи произведений.
   Внешность задаётся строкой: h — волосы, hs — причёска, c — одежда, p — брюки,
   s — рубашка, sk — кожа, hat=вид/цвет/лента, dress/apron/vest/stripes — детали,
   lb — длинная борода, patch — повязка, parrot — попугай, visor — шлем, we — белые
   глаза, nose — большой нос. gl, pipe, cane, gloves, ring, scarf, ink, beard, mus,
   lips, red, t=… — приметы: у подозреваемых они попадают в список примет и никогда
   не становятся «следом», чтобы рисунок и логика дела не спорили друг с другом.  */
function parseLook(str,isSus){
  const look={},fixT=[];
  const MAP_={h:'hair',hs:'hs',c:'coat',p:'pants',s:'shirt',tie:'tie',apron:'apron',vest:'vest',stripes:'stripes',visor:'visor',collar:'collar',num:'num',sym:'sym',eyes:'eyeC',anim:'anim'};
  const TRM={gl:['glasses','glasses'],pipe:['pipe','pipe'],cane:['cane','cane'],gloves:['gloves','gloves'],ring:['ring','ring'],scarf:['scarf','scarf'],ink:['ink','ink'],beard:['beard','beard'],mus:['mous','mustache'],lips:['lips','lips'],red:['red',null]};
  const FL={dress:'dress',lb:'lbeard',patch:'eyepatch',parrot:'parrot',we:'we',nose:'nose',scar:'scar',freckles:'freckles',track:'tracksuit',bleed:'bleed',wscarf:'wscarf',mark:'mark',grin:'grin',block:'block',stubble:'stubble',pine:'pine',tee:'tee',qmark:'qmark',chub:'chub',teeth:'teeth'};
  (str||'').split(';').forEach(tok=>{tok=tok.trim();if(!tok)return;const i=tok.indexOf('='),k=i<0?tok:tok.slice(0,i),v=i<0?undefined:tok.slice(i+1);
    if(k==='sk'){look.skin=v;return}
    if(k==='t'){if(isSus)v.split(',').forEach(x=>fixT.push(x));return}
    if(k==='hat'){const q=v.split('/');look.hat={k:q[0],c:q[1]||'#2a2a30',b:q[2]||null};if(isSus)fixT.push('hat');return}
    if(MAP_[k]&&v!==undefined){look[MAP_[k]]=v==='none'?null:v;return}
    if(k==='rgl'){look.rgl=1;if(isSus)fixT.push('glasses');else look.glasses=1;return}
    if(TRM[k]){if(isSus)fixT.push(TRM[k][0]);else if(TRM[k][1])look[TRM[k][1]]=1;else look.hair='#c2552a';return}
    if(FL[k]){look[FL[k]]=1;if(k==='lb'&&isSus)fixT.push('beard')}
  });
  return {look,fixT:[...new Set(fixT)]};
}

    let c=null;try{c=tryCase(diffKey,mode,(base+a*7919)>>>0,num,locId)}catch(e){c=null}
    if(c&&validateCase(c))return c;
  }
  /* запасной вариант: то же дело в обычной локации, чтобы игра никогда не падала */
  for(let a=0;a<200;a++){let c=null;try{c=tryCase(diffKey,mode==='bonus'?'normal':mode,(base+a*104729)>>>0,num)}catch(e){}if(c&&validateCase(c))return c}
  return tryCase(diffKey,mode,base>>>0,num,locId);
}

function tryCase(diffKey,mode,seed,num,locId){
  setSeed(seed);
  const D=DIFF[diffKey],quick=mode==='quick',n=quick?3:D.n;
  const loc=locId==='tutorial'?TUT_LOC:(locId&&BONUS_BY_ID[locId]?BONUS_BY_ID[locId]:chooseLocation(mode));
  const PRB=loc.profs||PROFS,PR=PRB.concat((loc.cast||[]).filter(c=>c.job).map(c=>({m:c.job,f:c.job,sk:c.sk})));
  const map=MAP.layout(loc);
  const hub=map.rooms[0],side=map.rooms.slice(1);
  const crimeIds=Object.keys(CRIMES).filter(id=>(!loc.crimes||loc.crimes.includes(id))&&side.some(r=>CRIMES[id].scenes.includes(r.kind)));
  const crime=weightedCrime(crimeIds,loc.crimesW);
  const scene=pick(side.filter(r=>crime.scenes.includes(r.kind)));
  scene.isScene=true;

  /* измерения и способ */
  let dims=(quick?['A','T1']:D.dims).slice();
  const ml=crime.methods.map(id=>mergeMethod(id,loc));
  let method;
  if(dims.includes('M')){const s=ml.filter(m=>m.sk);if(s.length)method=pick(s);else{dims=dims.filter(d=>d!=='M');if(!dims.includes('T2'))dims.push('T2');method=pick(ml)}}
  else method=pick(ml.filter(m=>!m.sk));
  const skill=dims.includes('M')?method.sk:null;

  /* время */
  const T=ri(21*60+5,23*60+15),W0=T-ri(8,12),W1=T+ri(8,12),C0=r5(T-ri(42,55)),C1=r5(T+ri(30,40));

  /* люди */
  const used={f:new Set(),l:new Set()};
  let vF=rnd()<(loc.vfem!=null?loc.vfem:.45);
  if(loc.victimFix)vF=!!loc.victimFix.female;
  const victim=Object.assign(loc.victimFix?Object.assign({},loc.victimFix):genPerson(vF,used,loc),{age:(loc.victimFix&&loc.victimFix.age)||ri(46,74)});
  victim.title=(loc.victimFix&&loc.victimFix.title)||pick(loc.victim)[vF?1:0];if(loc.victimFix)used.f.add(victim.first);
  const sus=[],cast=loc.cast?shuffle(loc.cast):null;
  for(let i=0;i<n;i++){
    let who;
    if(cast&&cast[i]){const cc=cast[i];who={first:cc.first,last:cc.last,name:cc.name,female:!!cc.female,cast:cc,look:cc.look,
      fixT:(cc.fixT||[]).filter(t=>TRAIT[t]&&(!TRAIT[t].g||TRAIT[t].g===(cc.female?'f':'m')))};if(cc.age)who.age=cc.age;used.f.add(cc.first)}
    else who=genPerson(rnd()<.45,used,loc);
    sus.push(Object.assign({id:'s'+i,kind:'s',age:ri(24,66),traits:[],says:[],met:false,broken:false,asked:{}},who))}
  const K=sus[ri(0,n-1)];K.killer=true;
  const inn=sus.filter(s=>s!==K);
  const forced=new Set();sus.forEach(s=>(s.fixT||[]).forEach(t=>forced.add(t)));
  /* у героев произведений внешность каноническая: следом не может быть то, что меняет лицо */
  const heroCase=sus.some(s=>s.cast),FACE=['red','glasses','pipe','scarf'];
  const pairT=shuffle(TRAITS.filter(t=>t.pair&&!forced.has(t.id)&&!(heroCase&&FACE.includes(t.id)))),t1=pairT[0],t2=pairT[1];

  /* кто чем исключается */
  const order=shuffle(dims);
  inn.forEach((s,i)=>s.prim=order[i%order.length]);
  const el={A:new Set(),T1:new Set(),T2:new Set(),M:new Set()};
  inn.forEach(s=>{el[s.prim].add(s.id);dims.forEach(d=>{if(d!==s.prim&&rnd()<.28)el[d].add(s.id)})});
  let nLiars=quick?0:D.liars;
  while(nLiars>0&&el.A.size<nLiars&&el.A.size<inn.length-1){const cnd=inn.filter(s=>!el.A.has(s.id));el.A.add(pick(cnd).id)}
  dims.forEach(d=>{if(inn.length&&inn.every(s=>el[d].has(s.id))){const cnd=inn.filter(s=>s.prim!==d);if(cnd.length)el[d].delete(pick(cnd).id)}});

  /* приметы */
  const T1on=dims.includes('T1'),T2on=dims.includes('T2');
  sus.forEach(s=>{
    if(T1on&&(s===K||!el.T1.has(s.id)))s.traits.push(t1.id);
    if(T2on&&(s===K||!el.T2.has(s.id)))s.traits.push(t2.id);
  });
  sus.forEach(s=>(s.fixT||[]).forEach(t=>{if(!s.traits.includes(t))s.traits.push(t)}));
  const distract=TRAITS.filter(t=>t!==t1&&t!==t2);
  sus.forEach(s=>{const want=Math.max(ri(2,3),s.traits.length);for(const t of shuffle(distract)){if(s.traits.length>=want)break;if(s.traits.includes(t.id))continue;if(s.cast&&t.vis)continue;if(t.g&&t.g!==(s.female?'f':'m'))continue;if(t.id==='beard'&&s.traits.includes('mous'))continue;if(t.id==='mous'&&s.traits.includes('beard'))continue;s.traits.push(t.id)}});

  /* профессии */
  const usedProf=new Set();
  const profPick=fl=>{let cnd=PRB.filter(p=>fl(p)&&!usedProf.has(p.m));if(!cnd.length)cnd=PRB.filter(fl);const p=pick(cnd);usedProf.add(p.m);return p};
  sus.forEach(s=>{
    let p;const want=skill?((s===K||!el.M.has(s.id))?(x=>x.sk===skill):(x=>x.sk!==skill)):(()=>true);
    const nat=s.cast&&s.cast.job?{m:s.cast.job,f:s.cast.job,sk:s.cast.sk||null}:null;
    if(nat&&want(nat)&&!usedProf.has(nat.m)){p=nat;usedProf.add(nat.m)}else p=profPick(want);
    s.prof=p;s.profName=s.female?p.f:p.m;
    /* герой сохраняет свою роль, а нужное делу ремесло — его прошлое */
    if(nat&&p!==nat)s.profName=nat.m+', в прошлом '+s.profName.toLowerCase();
  });

  /* отношения и мотивы */
  const rels=shuffle(RELATIONS);sus.forEach((s,i)=>{s.rel=(s.cast&&s.cast.rel)||rels[i%rels.length][s.female?1:0]});
  const mots=shuffle(MOTIVES),motive=mots[0];K.motive=motive;
  const herr=pickN(inn,quick?0:Math.min(D.herr,inn.length));herr.forEach((s,i)=>{s.motive=mots[1+i]});

  /* свидетели (персонал) */
  const wN=Math.min(quick?2:D.w,loc.staff.length);
  const wit=shuffle(loc.staff).slice(0,wN).map((r,i)=>{let who;
    if(r[3]){const nm=r[3].split('|');who={name:nm[0],first:nm[1]||nm[0].split(' ')[0],last:'',female:r[1]==='f',look:parseLook(r[4]||'',false).look};used.f.add(who.first)}
    else who=genPerson(r[1]==='f',used,loc);
    return Object.assign({id:'w'+i,kind:'w',age:ri(22,64),role:r[0],outfit:r[2],says:[],met:false,asked:{},traits:[]},who)});
  const walker=wit[0],posted=wit.slice(1);
  walker.room=hub;walker.walker=true;
  const freeRooms=shuffle(side.filter(r=>r!==scene));
  const take=()=>freeRooms.shift();
  posted.forEach(w=>{w.room=take()||hub});
  const offs=shuffle((loc.off||OFFPLACES[loc.id]||['на улице']).map((t,i)=>({id:'off'+i,in:t,off:true})));
  const offPlace=s=>offs.shift()||{id:'offx'+s.id,in:'на улице',off:true};

  /* алиби */
  if(!posted.length)nLiars=0;
  const liars=pickN(inn.filter(s=>el.A.has(s.id)),nLiars);
  liars.forEach(L=>{L.liar=true;L.secret=pick(SECRETS);const w=pick(posted);L.trueRoom=w.room;L.secretW=w;
    const fr=take();L.room=fr&&rnd()<.5?fr:offPlace(L);if(fr&&L.room!==fr)freeRooms.unshift(fr)});
  const conf=shuffle(inn.filter(s=>el.A.has(s.id)&&!s.liar));
  while(conf.length){
    const s=conf.shift(),r=rnd();
    if(posted.length&&r<.55){const w=pick(posted);s.room=w.room;s.src={t:'w',w}}
    else if(conf.length&&r<.8&&freeRooms.length){const s2=conf.shift(),room=take();s.room=s2.room=room;s.src={t:'pair',p:s2};s2.src={t:'pair',p:s}}
    else{const room=take();if(room){s.room=room;s.src={t:'rec',rec:pick(['phone','camera'])}}else if(posted.length){const w=pick(posted);s.room=w.room;s.src={t:'w',w}}else{s.room=hub;s.src={t:'rec',rec:'camera'}}}
  }
  inn.filter(s=>!el.A.has(s.id)).forEach(s=>{const fr=freeRooms.length&&rnd()<.45?take():null;s.room=fr||offPlace(s);s.alone=true});
  const kPartner=!quick&&posted.length&&rnd()<.35;
  if(kPartner){const w=pick(posted);K.room=w.room;K.claimWith=w;K.variant='partner'}
  else{const fr=freeRooms.length&&rnd()<.55?take():null;K.room=fr||offPlace(K);K.variant='alone';K.alone=true}
  K.away=[r5(T-ri(14,22)),r5(T+ri(10,16))];

  sus.forEach(s=>{s.claim={place:s.room,from:C0,to:C1}});

  /* показания и записи */
  const items=[];let iid=0;
  const item=o=>{o.id='i'+(iid++);o.found=false;o.facts=o.facts||[];items.push(o);return o};
  const pi=(p,ss)=>p.female?ss[1]:ss[0];
  const recRooms=side.filter(r=>r.recs&&r!==scene);
  const recRoom=()=>recRooms.length?pick(recRooms):hub;

  // свидетели на постах
  posted.forEach(w=>{
    const here=sus.filter(s=>(s.liar?s.trueRoom:s.room)===w.room&&s!==K);
    const facts=here.map(s=>({kind:'in',who:s.id,room:w.room.id,from:C0,to:C1,src:w.id,srcName:w.name}));
    let txt=`С ${hm(C0)} до ${hm(C1)} я ${G(w,'был','была')} ${w.room.in}.`;
    const plain=here.filter(s=>!s.liar);
    if(plain.length===1)txt+=` Со мной ${G(plain[0],'был','была')} ${plain[0].name} — никуда не ${G(plain[0],'отлучался','отлучалась')}.`;
    else if(plain.length>1)txt+=` Со мной были ${plain.map(s=>s.name).join(' и ')} — никто не отлучался.`;
    here.filter(s=>s.liar).forEach(L=>{txt+=` И ещё ${L.name} — всё время, с начала и до конца. ${gz(L.secret.w,L)}`});
    if(K.claimWith===w){
      facts.push({kind:'out',who:K.id,room:w.room.id,from:K.away[0],to:K.away[1],src:w.id,srcName:w.name,brk:1});
      txt+=` ${K.name} поначалу ${G(K,'был','была')} здесь, но около ${hm(K.away[0])} ${G(K,'вышел','вышла')} и ${G(K,'вернулся','вернулась')} только в ${hm(K.away[1])}.`;
    }
    if(!here.length&&K.claimWith!==w)txt+=` Сюда никто не заходил — я бы ${G(w,'заметил','заметила')}.`;
    w.says.push(item({kind:'testimony',src:w.id,n:'Показания: '+w.name,ic:'speech',d:txt,facts,proof:K.claimWith===w?1:0}));
  });
  // взаимные пары
  sus.filter(s=>s.src&&s.src.t==='pair').forEach(s=>{
    const p=s.src.p;
    s.says.push(item({kind:'testimony',src:s.id,n:'Показания: '+s.name,ic:'speech',
      d:`С ${hm(C0)} до ${hm(C1)} я ${G(s,'был','была')} ${s.room.in}. ${p.name} ${G(p,'был','была')} там же и никуда не ${G(p,'отлучался','отлучалась')}.`,
      facts:[{kind:'in',who:p.id,room:s.room.id,from:C0,to:C1,src:s.id,srcName:s.name}]}));
  });
  // записи (АТС, камеры)
  sus.filter(s=>s.src&&s.src.t==='rec').forEach(s=>{
    const a=W0-ri(12,22),b=W1+ri(6,14);
    const ph=s.src.rec==='phone';
    item({kind:'record',role:'confirm',ic:ph?'phone':'camera',n:ph?'Распечатка внутренней АТС':'Запись камеры наблюдения',
      d:ph?`С ${hm(a)} до ${hm(b)} ${s.name} ${G(s,'говорил','говорила')} по телефону ${s.room.in} — линия была занята всё это время.`
          :`Камера ${s.room.in}: ${s.name} ${G(s,'находился','находилась')} там с ${hm(a)} до ${hm(b)} и не ${G(s,'выходил','выходила')}.`,
      facts:[{kind:'in',who:s.id,room:s.room.id,from:a,to:b,src:'rec',srcName:ph?'АТС':'камера'}],room:recRoom()});
  });
  // разоблачение убийцы
  let breakItem=null;
  if(K.variant==='alone'){
    const strong=quick||D.strong;
    if(strong&&recRooms.length&&rnd()<.45){
      const t=T-ri(2,6);
      breakItem=item({kind:'record',role:'break',ic:'log',n:'Журнал электронного замка',proof:1,room:recRoom(),
        d:`Дверь ${scene.gen}: в ${hm(t)} открыто ключом-картой «${K.name}». Других открытий за вечер нет.`,
        facts:[{kind:'pt',who:K.id,room:scene.id,t,src:'rec',srcName:'замок',brk:1}]});
    }else if(strong){
      const t=T+ri(2,6);
      walker.says.push(breakItem=item({kind:'testimony',src:walker.id,n:'Показания: '+walker.name,ic:'speech',proof:1,
        d:`Около ${hm(t)} я ${G(walker,'видел','видела')}, как ${K.name} ${G(K,'выходил','выходила')} ${scene.from}. Очень ${G(K,'торопился','торопилась')}, на меня даже не ${G(K,'взглянул','взглянула')}.`,
        facts:[{kind:'pt',who:K.id,room:scene.id,t,src:walker.id,srcName:walker.name,brk:1}]}));
    }else{
      const t=T+ri(-7,-2);
      walker.says.push(breakItem=item({kind:'testimony',src:walker.id,n:'Показания: '+walker.name,ic:'speech',proof:1,
        d:`Около ${hm(t)} я ${G(walker,'проходил','проходила')} ${hub.via}. Навстречу ${G(K,'шёл','шла')} ${K.name} — к двери, что ведёт ${scene.to}.`,
        facts:[{kind:'pt',who:K.id,room:hub.id,t,src:walker.id,srcName:walker.name,brk:1}]}));
    }
  }else breakItem=items.find(i=>i.facts.some(f=>f.brk));
  // ранние визиты к жертве — отвлекающие, вне времени показаний
  const withV=crime.id==='murder'?'с жертвой':G(victim,'с хозяином','с хозяйкой');
  pickN(inn,quick?0:D.early).forEach(s=>{
    const t=C0-ri(15,45);
    walker.says.push(item({kind:'testimony',src:walker.id,n:'Показания: '+walker.name,ic:'speech',
      d:`Ещё в ${hm(t)} ${s.name} ${G(s,'заходил','заходила')} ${scene.to} — о чём-то ${G(s,'спорил','спорила')} ${withV}. Потом ${G(s,'ушёл','ушла')}.`,
      facts:[{kind:'pt',who:s.id,room:scene.id,t,src:walker.id,srcName:walker.name}]}));
  });
  // подброшенная улика
  let F=null,planted=null;
  if(!quick&&D.framed){const cnd=inn.filter(s=>el.A.has(s.id)&&!s.liar);if(cnd.length){F=pick(cnd);planted=pick(PLANTED);F.framed=planted;
    walker.says.push(item({kind:'testimony',src:walker.id,n:'Показания: '+walker.name,ic:'speech',
      d:`Ещё днём ${F.name} ${G(F,'потерял','потеряла')} ${planted.what} — ${G(F,'спрашивал','спрашивала')} всех, не попадалась ли.`,facts:[{kind:'note',who:F.id}]}))}}
  if(!walker.says.length)walker.says.push(item({kind:'testimony',src:walker.id,n:'Показания: '+walker.name,ic:'speech',d:`Я весь вечер ${G(walker,'ходил','ходила')} туда-сюда по делам. Ничего странного не ${G(walker,'заметил','заметила')}.`}));

  /* физические улики */
  const tgt=crimeTarget(crime,scene,loc);
  const what=pick(loc.loot);
  const timeD={
    murder:`Наручные часы жертвы разбились при падении и встали на ${hm(T)}. Судмедэксперт согласен: смерть наступила между ${hm(W0)} и ${hm(W1)}.`,
    theft:`Датчик на дверце сработал в ${hm(T)}, и его тут же сбросили вручную. Кражу совершили между ${hm(W0)} и ${hm(W1)}.`,
    forgery:`Чернила на подложной странице не до конца просохли. Эксперт: документ подменили между ${hm(W0)} и ${hm(W1)}.`,
    sabotage:`Автоматика записала сбой в ${hm(T)}. Испорчено всё было незадолго до этого — между ${hm(W0)} и ${hm(W1)}.`
  }[crime.id];
  item({kind:'ev',role:'time',scene:1,target:1,ic:{murder:'watch',theft:'alarm',forgery:'pen',sabotage:'log'}[crime.id],n:{murder:'Часы жертвы',theft:'Журнал датчика',forgery:'Свежие чернила',sabotage:'Журнал аварии'}[crime.id],d:timeD});
  item({kind:'ev',role:'method',scene:1,ic:method.ev.ic,n:method.ev.n,proof:skill?1:0,
    d:method.ev.d+(skill?` Такое под силу только тому, кто разбирается в ${skTxt(loc,skill)}: ${skillListOf(PR,skill)}.`:'')});
  if(T1on)item({kind:'ev',role:'trace',scene:1,trait:t1.id,ic:t1.clue.ic,n:t1.clue.n,d:t1.clue.d,spot:t1.clue.spot,proof:1});
  if(T2on)item({kind:'ev',role:'trace',scene:1,trait:t2.id,ic:t2.clue.ic,n:t2.clue.n,d:t2.clue.d,spot:t2.clue.spot,proof:1});
  if(F)item({kind:'ev',role:'framed',scene:1,owner:F.id,ic:planted.ic,n:planted.n,d:`${planted.n}. По гравировке ясно, чья это вещь: ${F.name}. Лежала на самом виду.`});
  item({kind:'ev',role:'motive',who:K.id,motive:motive.id,ic:motive.ic,n:motive.doc,d:motive.d(K,victim),proof:1,doc:1,pref:'priv'});
  herr.forEach(s=>item({kind:'ev',role:'herring',who:s.id,motive:s.motive.id,ic:s.motive.ic,n:s.motive.doc,d:s.motive.d(s,victim),doc:1}));
  const nzN=quick?2:D.noise;
  (loc.noise?shuffle(loc.noise).slice(0,Math.min(2,nzN)):[]).concat(shuffle(NOISE)).slice(0,nzN).forEach(nz=>item({kind:'ev',role:'noise',ic:nz.ic,n:nz.n,d:nz.d}));

  /* мебель и раскладка улик */
  MAP.furnish(map,scene,tgt);
  const objs=map.objs.filter(o=>o.name);
  const taken=new Set();
  const put=(it,cands,re)=>{
    let c2=cands.filter(o=>!taken.has(o.id)&&!o.target);
    if(re){const pr=c2.filter(o=>re.test(o.name));if(pr.length)c2=pr}
    if(!c2.length)return false;
    const o=pick(c2);taken.add(o.id);o.item=it.id;it.obj=o.id;it.room=map.rooms[o.room];return true;
  };
  const inRoom=r=>objs.filter(o=>o.room===r.idx);
  const docRe=/стол|сейф|шкаф|комод|тумб|картотек|сундук|чемодан|бюро|полк|стеллаж|ящик|кофр/i;
  const recRe=/стол|пульт|стойк|картотек|шкаф|журнал|панел/i;
  const tObj=objs.find(o=>o.target);
  const timeIt=items.find(i=>i.role==='time');
  if(!tObj)return null;
  tObj.item=timeIt.id;timeIt.obj=tObj.id;timeIt.room=scene;taken.add(tObj.id);
  for(const it of items.filter(i=>i.scene&&i.role!=='time')){
    const re=it.spot||(it.role==='method'?/стол|кресл|диван|камин|ковёр|шкаф|комод|полк|корзин/i:null);
    if(!put(it,inRoom(scene),re))return null;
  }
  for(const it of items.filter(i=>i.doc)){
    const priv=objs.filter(o=>map.rooms[o.room].priv&&!map.rooms[o.room].isScene);
    const other=objs.filter(o=>!map.rooms[o.room].isScene);
    if(!(it.pref==='priv'&&put(it,priv,docRe))&&!put(it,other,docRe)&&!put(it,objs,null))return null;
  }
  for(const it of items.filter(i=>i.kind==='record')){
    if(!put(it,inRoom(it.room),recRe)&&!put(it,objs.filter(o=>!map.rooms[o.room].isScene),recRe)&&!put(it,objs,null))return null;
  }
  for(const it of items.filter(i=>i.role==='noise')){
    const notScene=objs.filter(o=>!map.rooms[o.room].isScene);
    if(!put(it,notScene,null)&&!put(it,objs,null)){items.splice(items.indexOf(it),1)}
  }

  /* реплики на допросе */
  const people=[...sus,...wit];
  people.forEach(p=>{p.app=makeApp(p,loc)});
  sus.forEach(s=>{
    const pl=s.room;
    const placeTxt=pl.off?gz(pl.in,s):pl.in;
    let where=`С ${hm(C0)} до ${hm(C1)} я ${G(s,'был','была')} ${placeTxt}`,who;
    if(s===K&&K.claimWith){where+=`. Там же ${G(K.claimWith,'был','была')} ${K.claimWith.role.toLowerCase()} — ${K.claimWith.name}.`;who=`Спросите ${K.claimWith.name}, ${G(K.claimWith,'он','она')} подтвердит.`}
    else if(s.src&&s.src.t==='w'){where+=`. Там же всё время ${G(s.src.w,'был','была')} ${s.src.w.role.toLowerCase()} — ${s.src.w.name}.`;who=`${s.src.w.name}. Мы были в одной комнате.`}

    else if(s.src&&s.src.t==='rec'){where+=s.src.rec==='phone'?`, ${G(s,'говорил','говорила')} по телефону — долго, почти час.`:`. Там, кажется, висит камера.`;who=s.src.rec==='phone'?'Проверьте распечатку звонков — линия была занята.':'Камера. Она должна была всё записать.'}
    else{where+=pl.off?`. ${G(s,'Один','Одна')}, свидетелей нет.`:`, ${G(s,'один','одна')}. Хотелось тишины.`;who='Никто. Я '+G(s,'был','была')+' '+G(s,'один','одна')+'.'}
    s.lines={where,who};
    const evasive=s===K||s.motive;
    s.lines.rel=`Я ${s.rel.toLowerCase()}. `+(evasive?pick(['Отношения были… непростые.','Мы давно не ладили, это все знают.','Скажем так, у нас были разногласия.']):pick(['Мы были близки, хоть и спорили.','Виделись нечасто, но тепло.','Отношения ровные, деловые.','Знаю '+G(victim,'его','её')+' много лет.']));
    if(!s.says.length)s.lines.seen=s===K?`Ничего. Я ${G(K,'был','была')} ${placeTxt.replace(/^на улице$/,'на улице')} и ничего не ${G(K,'слышал','слышала')}.`:pick([`Около ${hm(T+ri(-3,3))} мне показалось, что хлопнула дверь. Но я не ${G(s,'выглянул','выглянула')}.`,'Ничего особенного. Дождь шумел так, что не слышно было даже часов.',`Свет мигнул пару раз — около ${hm(T-ri(20,40))}. Больше ничего.`]);
  });
  wit.forEach(w=>{w.lines={where:w.walker?`Весь вечер я ${G(w,'ходил','ходила')} по делам — ${hub.in} и по комнатам.`:`С ${hm(C0)} до ${hm(C1)} я ${G(w,'был','была')} ${w.room.in}, на своём месте.`}});

    opener:pick(loc.openers||OPENERS),brief,title:{murder:'Смерть',theft:'Пропажа',forgery:'Подмена',sabotage:'Обрыв'}[crime.id]+' '+scene.in,

  };
  c.ev=items.filter(i=>i.kind==='ev'||i.kind==='record');

}

/* где люди находятся сейчас (после преступления) */
function placeNPCs(c){
  const M=c.map,W=M.w,N=W*M.h,usedT=new Set(),reach=new Uint8Array(N),q=[];
  /* клетки, до которых можно дойти от входа: туда и ставим людей, чтобы никто не оказался заперт мебелью */
  const walk=i=>i>=0&&i<N&&M.g[i]===2&&!M.blocked[i],s0=Math.floor(M.spawn.y/TS)*W+Math.floor(M.spawn.x/TS);
  if(walk(s0)){reach[s0]=1;q.push(s0)}
  for(let h=0;h<q.length;h++){const i=q[h];for(const d of[1,-1,W,-W]){const j=i+d;if(walk(j)&&!reach[j]){reach[j]=1;q.push(j)}}}
  const open=i=>[1,-1,W,-W].filter(d=>reach[i+d]&&!usedT.has(i+d)).length;
  const pickIn=r=>{const best=[],ok2=[];for(let y=r.y1;y<=r.y2;y++)for(let x=r.x1;x<=r.x2;x++){const i=y*W+x;
      if(M.g[i]!==2||M.rid[i]!==r.idx||!reach[i]||M.reserved[i]||usedT.has(i))continue;const k=open(i);if(k>=3)best.push(i);else if(k>=2)ok2.push(i)}
    return best.length?pick(best):ok2.length?pick(ok2):null};
  c.people.forEach(p=>{
    let room=p.kind==='w'?p.room:(p.room&&!p.room.off?p.room:c.hub);
    if(p.liar&&p.room.off)room=c.hub;
    if(!room||room.isScene)room=c.hub;
    let ti=pickIn(room);
    if(ti==null&&room!==c.hub){room=c.hub;ti=pickIn(room)}
    if(ti==null){for(let i=0;i<N;i++)if(reach[i]&&M.rid[i]===c.hub.idx&&!usedT.has(i)){ti=i;break}}
    if(ti==null)ti=room.y2*W+((room.x1+room.x2)>>1);
    usedT.add(ti);
    p.home=room.idx;p.sx=(ti%W)*16+8;p.sy=Math.floor(ti/W)*16+12;
  });
}

/* проверка: решаемо и однозначно */
function validateCase(c){
  if(!c)return false;
  const K=c.killer;
  const surv=c.sus.filter(s=>!elimReasons(c,s,false).length);
  if(surv.length!==1||surv[0]!==K)return false;
  for(const d of c.dims){const s2=c.sus.filter(s=>!elimReasons(c,s,false,d).length);if(s2.length<2)return false}
  const allF=[];c.items.forEach(i=>(i.facts||[]).forEach(f=>allF.push(f)));
  for(const s of c.sus){
    const cn=allF.filter(f=>contradicts(f,s)).length;
    if(s===K){if(!cn)return false}
    else if(s.liar){if(!cn)return false}
    else if(cn)return false;
  }
  if(!c.breakItem)return false;
  for(const it of c.items)if((it.kind==='ev'||it.kind==='record')&&!it.obj)return false;
  if(c.items.filter(i=>i.scene).some(i=>!i.obj))return false;
  return true;
}

/* реконструкция для финала */
function caseStory(c){
  const K=c.killer,w=K.claimWith,place=K.room.off?gz(K.room.in,K):K.room.in;
  const out=[];
  out.push(`${hm(c.C0)}. Все разошлись по местам. ${K.name} ${G(K,'сказал','сказала')}, что будет ${place}${w?' — рядом с '+w.role.toLowerCase()+'м'.replace('мм','м'):''}.`.replace(/рядом с (\S+?)ам\b/,'рядом с $1ом'));
  out.push(`Около ${hm(K.away[0])} ${G(K,'он','она')} незаметно ${G(K,'ушёл','ушла')} и ${c.hub.via} ${G(K,'пробрался','пробралась')} ${c.scene.to}.`);
  out.push(`В ${hm(c.T)} ${K.name} ${gz(c.method.how,K)}. Мотив — ${c.motive.lab.toLowerCase()}.`);
  out.push(`К ${hm(K.away[1])} ${G(K,'он','она')} ${G(K,'вернулся','вернулась')} и ${G(K,'делал','делала')} вид, что никуда не ${G(K,'отлучался','отлучалась')}.`);
  const tr=[c.t1,c.t2].filter(Boolean).map(t=>TRAIT[t].clue.n.toLowerCase());
  out.push(`${G(K,'Его','Её')} выдали ${tr.length?tr.join(' и ')+', ':''}${c.skill?'профессиональный почерк, ':''}а ещё ${c.breakItem.kind==='record'?'запись, о которой '+G(K,'он','она')+' не '+G(K,'знал','знала'):'свидетель, которого '+G(K,'он','она')+' не '+G(K,'заметил','заметила')}.`);
  return out;
}
/* убираем неудачную склейку из первой строки */
function caseStoryClean(c){const s=caseStory(c);s[0]=s[0].replace(/ — рядом с .*?\./,'.');if(c.killer.claimWith)s[0]=s[0].replace(/\.$/,`, где ${G(c.killer.claimWith,'был','была')} ${c.killer.claimWith.name}.`);return s}

  inRoom(M,r,x,y){return x>=r.x1&&x<=r.x2&&y>=r.y1&&y<=r.y2&&M.g[y*M.w+x]===2&&M.rid[y*M.w+x]===r.idx},

  /* деревья и кусты не ставим вплотную: кроны не слипаются, между ними остаётся проход */

  furnishRoom(M,r,tgt){

      for(let k=offs;k<spiral.length;k++){
        const tx=Math.round(spiral[k][0]-ot.tw/2+.5),ty=Math.round(spiral[k][1]-ot.th/2+.5);

      rift:[2],portrait:[2],starwin:[2],carpetwall:[2],banner:[2],tapestry:[1],torch:[1],deerhead:[1],mapscreen:[2],icon:[1],buoy:[1],alphabet:[2],sqmural:[2],vaultdoor:[2]};
    const xs=shuffle(Array.from({length:r.x2-r.x1+1},(_,i)=>r.x1+i));

        if(t==='mapscreen')M.lights.push({x:x2*TS+w*8,y:(r.y1-1)*TS,r:40,k:.5,c:'80,230,190',fl:2});

        break}}
    }
  },
  furnishPlanYard(M,r){

  nbTl(c){

  drawBigMap(){
    const c=STATE.case,M=c.map,k=16,cv=$('bigmap');if(!cv)return;cv.width=M.w*k;cv.height=M.h*k;const x=cv.getContext('2d');
    x.fillStyle='#1b2238';x.fillRect(0,0,cv.width,cv.height);

      x.strokeStyle=r.isScene?'#e05a44':ex?sh(ROOMCOL[i%ROOMCOL.length],-.15):'#3a4460';x.lineWidth=r.isScene?3:2;x.strokeRect(r.x1*k+1,r.y1*k+1,(r.x2-r.x1+1)*k-2,(r.y2-r.y1+1)*k-2)});
    if(M.terr)for(let i=0;i<M.terr.length;i++){const v=M.terr[i];const col={1:'#24527a',2:'#a89060',3:'#3a4224',4:'#1e4a26',6:'#7a6a2a',7:'#7a5a36',8:'#4a4a4e'}[v];if(col){x.fillStyle=col;x.fillRect((i%M.w)*k,((i/M.w)|0)*k,k,k)}}
    M.doors.forEach(d=>d.cells.forEach(([a,b])=>{x.fillStyle='#4a5470';x.fillRect(a*k,b*k,k,k)}));
    M.objs.forEach(o=>{if(!o.name||!STATE.explored.has(o.room))return;x.fillStyle=o.marker?'#f2c230':o.insp?'#5a6280':'#f2a93b';x.fillRect((o.tx+o.tw/2)*k-3,(o.ty+o.th/2)*k-3,6,6)});
    x.font='600 13px '+PXT.font;x.textAlign='center';x.textBaseline='middle';
    M.rooms.forEach((r,i)=>{const ex=STATE.explored.has(i);const cx=(r.x1+r.x2+1)/2*k,cy=(r.y1+r.y2+1)/2*k;x.fillStyle='rgba(8,10,20,.7)';const t=ex?r.n:'?';const w=x.measureText(t).width+8;x.fillRect(cx-w/2,cy-8,w,16);x.fillStyle=r.isScene?'#ff9a84':'#ece3cd';x.fillText(t,cx,cy)});
    ENG.npcs.forEach(n=>{if(!n.p.met)return;const px=n.x/TS*k,py=n.y/TS*k;x.fillStyle=n.p.kind==='w'?'#63b6c6':n.p.broken?'#e05a44':'#ece3cd';x.beginPath();x.arc(px,py,7,0,7);x.fill();x.fillStyle='#111';x.font='bold 10px sans-serif';x.fillText(n.p.first[0],px,py+.5)});

  },
  mapClick(e){
